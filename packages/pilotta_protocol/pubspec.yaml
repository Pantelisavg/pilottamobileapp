name: pilotta_protocol
description: >
  Transport-agnostic JSON message protocol for multiplayer Pilotta: the same
  message types are used over a WebSocket connection (online play) and over
  a Nearby Connections link (Bluetooth/local-network play with no internet),
  so the server and the client-side game controllers share one wire format.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ^3.5.0

dependencies:
  pilotta_engine:
    path: ../pilotta_engine

dev_dependencies:
  test: ^1.25.0
  lints: ^4.0.0
  fake_async: ^1.3.1
